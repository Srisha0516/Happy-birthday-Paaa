<!DOCTYPE html>
<html>

<title>Music</title>
</head>

<body style="margin:0">

<audio id="bgMusic" autoplay loop>

<source src="vlc-record-2026-03-17-10h29m30s-Innunu Bekagide - Vasuki Vaibhav-(Fun2Desi.Com)-.mp3" type="audio/mpeg">

<script>

/* save music playing */

document.addEventListener("click", function(){

});

</script>

</body>
