<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forever Special 💚</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
min-height:100vh;
padding:40px 0;
overflow-y:auto;
overflow-x:hidden;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#02150f,#000000);
position:relative;
}

/* ✨ glowing background */

.bg-glow{
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#00ff88 0%,transparent 70%);
filter:blur(120px);
opacity:0.25;
animation:pulse 5s infinite alternate;
}

@keyframes pulse{

from{
transform:scale(1);
opacity:0.2;
}

to{
transform:scale(1.2);
opacity:0.35;
}

}

/* 💚 floating hearts */

.hearts span{
position:absolute;
bottom:-100px;
font-size:25px;
animation:float 10s linear infinite;
opacity:0.7;
color:#7dffb3;
}

.hearts span:nth-child(1){left:10%;animation-duration:8s;}
.hearts span:nth-child(2){left:20%;animation-duration:12s;}
.hearts span:nth-child(3){left:35%;animation-duration:9s;}
.hearts span:nth-child(4){left:50%;animation-duration:11s;}
.hearts span:nth-child(5){left:65%;animation-duration:7s;}
.hearts span:nth-child(6){left:80%;animation-duration:10s;}
.hearts span:nth-child(7){left:90%;animation-duration:13s;}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

50%{
opacity:1;
}

100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}

}

/* 🌌 final card */

.final-box{
position:relative;
z-index:2;
width:75%;
max-width:850px;
padding:50px;
border-radius:35px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
box-shadow:0 10px 40px rgba(255,255,255,0.08);
text-align:center;
animation:fadeUp 2s ease;
margin:40px 0;
}

/* animation */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* image */

.final-box img{
width:260px;
height:260px;
object-fit:cover;
border-radius:50%;
border:6px solid rgba(255,255,255,0.3);
box-shadow:0 10px 30px rgba(0,255,136,0.25);
margin-bottom:30px;
animation:floatPhoto 4s ease-in-out infinite;
}

@keyframes floatPhoto{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* heading */

.final-box h1{
font-size:65px;
margin-bottom:25px;
color:#7dffb3;
text-shadow:
0 0 10px #7dffb3,
0 0 20px #7dffb3,
0 0 40px #7dffb3;
}

/* typing text */

#typing{
font-size:28px;
line-height:1.8;
color:#f1f1f1;
min-height:140px;
margin-top:15px;
}

/* buttons */

.end-btn{
margin-top:40px;
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
}

.end-btn button{
padding:16px 45px;
border:none;
border-radius:40px;
background:#00ff88;
color:#022b1b;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 8px 20px rgba(0,255,136,0.3);
}

.end-btn button:hover{
transform:scale(1.08);
background:#7dffb3;
}

/* home button */

.home-btn{
background:white !important;
color:#00aa66 !important;
}

.home-btn:hover{
background:#dffff0 !important;
}

/* 💚 scrollbar */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-track{
background:#02150f;
}

::-webkit-scrollbar-thumb{
background:#00ff88;
border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
background:#7dffb3;
}

/* mobile */

@media(max-width:768px){

.final-box{
width:92%;
padding:35px 20px;
}

.final-box img{
width:180px;
height:180px;
}

.final-box h1{
font-size:40px;
}

#typing{
font-size:20px;
min-height:180px;
}

.end-btn button{
font-size:18px;
padding:14px 30px;
width:100%;
}

}

</style>

</head>

<body>

<!-- glow -->

<div class="bg-glow"></div>

<!-- hearts -->

<div class="hearts">

<span>💚</span>
<span>✨</span>
<span>💚</span>
<span>✨</span>
<span>💚</span>
<span>✨</span>
<span>💚</span>

</div>

<!-- final card -->

<div class="final-box">

<!-- 💚 your final image -->

<img src="cc8699ad-b381-43ee-9a7d-21fd6f10b623.jpg">

<h1>Forever Special 💚</h1>

<p id="typing"></p>

<!-- buttons -->

<div class="end-btn">

<button onclick="ending()">
The End ✨
</button>

<button onclick="goHome()" class="home-btn">
Back To Start 💚
</button>

</div>

</div>

<script>

/* 💚 typing effect */

const message =
"const message =
"Meeting you was never just a coincidence 💚 You became a beautiful reason behind so many smiles and happy moments in my life ✨ Thank you for being exactly who you are 🌸 You truly mean more to me than words can explain 💖 I Love You Paa 💚";

let i = 0;

function typeText(){

if(i < message.length){

document.getElementById("typing").innerHTML += message.charAt(i);

i++;

setTimeout(typeText,45);

}

}

typeText();

/* ✨ end popup */

function ending(){

alert("Happy Birthday Once Again 💚✨");

}

/* 💚 back to password/start page */

function goHome(){

window.location.href="index.html";

}

</script>

</body>

</html>
