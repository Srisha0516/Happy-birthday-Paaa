<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You 💚</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Segoe UI',sans-serif;
text-align:center;
background:linear-gradient(135deg,#00FF7F,#b8ffd8);
color:#064d2f;
overflow-x:hidden;
min-height:100vh;
position:relative;
}

/* 💚 floating hearts */

.hearts span{
position:absolute;
bottom:-100px;
font-size:24px;
animation:float 10s linear infinite;
opacity:0.7;
}

.hearts span:nth-child(1){left:10%;animation-duration:8s;}
.hearts span:nth-child(2){left:20%;animation-duration:12s;}
.hearts span:nth-child(3){left:35%;animation-duration:9s;}
.hearts span:nth-child(4){left:50%;animation-duration:11s;}
.hearts span:nth-child(5){left:65%;animation-duration:7s;}
.hearts span:nth-child(6){left:80%;animation-duration:10s;}
.hearts span:nth-child(7){left:90%;animation-duration:13s;}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

50%{
opacity:1;
}

100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}

}

.container{
padding:50px 20px 140px;
position:relative;
z-index:2;
}

/* heading */

h1{
font-size:65px;
margin-bottom:25px;
color:white;
text-shadow:0 5px 15px rgba(0,0,0,0.25);
animation:fadeDown 1.5s ease;
}

@keyframes fadeDown{

from{
opacity:0;
transform:translateY(-30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* typing message */

#message{
font-size:30px;
font-weight:bold;
line-height:1.7;
min-height:100px;
margin-bottom:35px;
padding:0 20px;
color:white;
text-shadow:0 3px 10px rgba(0,0,0,0.2);
}

/* 🎵 music player */

audio{
margin-top:20px;
width:300px;
border-radius:30px;
}

/* slideshow */

.slideshow-container{
width:340px;
height:460px;
margin:50px auto;
position:relative;
overflow:hidden;
border-radius:30px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
animation:popup 1.5s ease;
}

@keyframes popup{

from{
opacity:0;
transform:scale(0.8);
}

to{
opacity:1;
transform:scale(1);
}

}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
left:0;
top:0;
opacity:0;
transition:opacity 1s ease-in-out;
}

.slide.active{
opacity:1;
}

/* glow effect */

.slideshow-container::after{
content:'';
position:absolute;
inset:0;
border-radius:30px;
box-shadow:0 0 30px rgba(255,255,255,0.3);
pointer-events:none;
}

/* next button */

.next-btn{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
z-index:5;
}

.next-btn button{
padding:16px 45px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:45px;
background:white;
color:#00aa66;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
}

.next-btn button:hover{
background:#f3fff8;
transform:scale(1.08);
}

/* 💚 scrollbar */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-track{
background:#c8ffe2;
}

::-webkit-scrollbar-thumb{
background:#00cc77;
border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
background:#00aa66;
}

/* mobile */

@media(max-width:768px){

h1{
font-size:42px;
}

#message{
font-size:21px;
min-height:140px;
}

.slideshow-container{
width:90%;
height:420px;
}

audio{
width:90%;
}

.next-btn button{
font-size:18px;
padding:14px 30px;
}

}

</style>

</head>

<body>

<!-- 💚 floating hearts -->

<div class="hearts">

<span>💚</span>
<span>✨</span>
<span>💚</span>
<span>✨</span>
<span>💚</span>
<span>✨</span>
<span>💚</span>

</div>

<div class="container">

<h1>Something for You 💚</h1>

<div id="message"></div>

<!-- 🎵 MUSIC -->

<audio autoplay loop controls>

<source src="vlc-record-2026-03-17-10h29m30s-Innunu Bekagide - Vasuki Vaibhav-(Fun2Desi.Com)-.mp3" type="audio/mpeg">

</audio>

<!-- SLIDESHOW -->

<div class="slideshow-container">

<img src="0ad38ac2-9111-43c8-ad9a-cce2799ec1a7.jpg" class="slide active">

<img src="f7fba758-3420-4588-8362-21aed5b70d36.jpg" class="slide">

<img src="4ca1a41d-4a98-41de-99b9-a01d5cf987ae.jpg" class="slide">

<img src="1ad18c1e-b076-41b1-98bb-d322c08e0744.jpg" class="slide">

</div>

</div>

<!-- NEXT BUTTON -->

<div class="next-btn">

<button onclick="nextPage()">
Next 💚
</button>

</div>

<script>

/* 💚 typing effect */

const text =
"You are one of the most special people in my life 💚 Thank you for all the smiles, memories, laughter, and beautiful moments we share ✨";

let i = 0;

function typing(){

if(i < text.length){

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typing,40);

}

}

typing();

/* ✨ slideshow */

let slides = document.querySelectorAll(".slide");

let currentSlide = 0;

function changeSlide(){

slides[currentSlide].classList.remove("active");

currentSlide++;

if(currentSlide >= slides.length){

currentSlide = 0;

}

slides[currentSlide].classList.add("active");

}

setInterval(changeSlide,2500);

/* 💚 next page */

function nextPage(){

window.location.href = "message.html";

}

</script>

</body>
</html>
