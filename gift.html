<!DOCTYPE html>
<html>
<head>

<title>Special For You 💚</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
text-align:center;
background:linear-gradient(to right,#00FF7F,#b8ffd8);
color:#064d2f;
overflow-x:hidden;
}

.container{
padding:40px;
padding-bottom:120px;
}

h1{
margin-bottom:20px;
font-size:55px;
}

/* typing message */
#message{
font-size:28px;
font-weight:bold;
min-height:60px;
margin-bottom:30px;
padding:0 40px;
line-height:1.5;
}

audio{
margin:20px 0;
}

/* slideshow */
.slideshow-container{
width:320px;
height:420px;
margin:40px auto;
position:relative;
}

.slide{
width:100%;
height:100%;
object-fit:cover;
border-radius:25px;
position:absolute;
left:0;
top:0;
opacity:0;
transition:opacity 1.2s ease-in-out, transform 0.5s;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.slide.active{
opacity:1;
}

.slide:hover{
transform:scale(1.03);
}

/* next button */
.next-btn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:999;
}

.next-btn button{
padding:14px 40px;
background:#00FF7F;
border:none;
border-radius:30px;
color:#064d2f;
font-size:20px;
cursor:pointer;
font-weight:bold;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
transition:0.3s;
}

.next-btn button:hover{
background:#00cc66;
transform:scale(1.08);
}

</style>

</head>

<body>

<div class="container">

<h1>Something for You 💚</h1>

<!-- typing message -->
<div id="message"></div>

<!-- 🎵 SONG -->
<audio autoplay loop controls>
<source src="vlc-record-2026-03-17-10h29m30s-Innunu Bekagide - Vasuki Vaibhav-(Fun2Desi.Com)-.mp3" type="audio/mpeg">
</audio>

<!-- 📸 SLIDESHOW -->
<div class="slideshow-container">

<img class="slide active" src="0ad38ac2-9111-43c8-ad9a-cce2799ec1a7.jpg">

<img class="slide" src="f7fba758-3420-4588-8362-21aed5b70d36.jpg">

<img class="slide" src="4ca1a41d-4a98-41de-99b9-a01d5cf987ae.jpg">

<img class="slide" src="1ad18c1e-b076-41b1-98bb-d322c08e0744.jpg">

</div>

</div>

<!-- next button -->
<div class="next-btn">
<button onclick="nextPage()">Next 💚</button>
</div>

<script>

// typing effect
var text = "You are one of the most special people in my life... 💚 Thank you for all the smiles, memories, and moments we share.";

var i = 0;

function typing(){

if(i < text.length){

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typing,40);

}

}

typing();


// slideshow
let slides = document.querySelectorAll(".slide");

let index = 0;

function showSlides(){

slides.forEach((slide)=>{
slide.classList.remove("active");
});

index++;

if(index >= slides.length){
index = 0;
}

slides[index].classList.add("active");

}

setInterval(showSlides,2500);


// next page
function nextPage(){

window.location.href = "message.html";

}

</script>

</body>
</html>
