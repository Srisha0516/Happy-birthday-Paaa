<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You 💚</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
text-align:center;
background:linear-gradient(to right,#00FF7F,#b8ffd8);
color:#064d2f;
overflow-x:hidden;
}

.container{
padding:40px;
padding-bottom:120px;
}

h1{
font-size:55px;
margin-bottom:20px;
}

/* typing message */

#message{
font-size:28px;
font-weight:bold;
line-height:1.5;
min-height:80px;
margin-bottom:30px;
padding:0 20px;
}

/* audio */

audio{
margin:25px 0;
}

/* slideshow */

.slideshow-container{
width:320px;
height:420px;
margin:40px auto;
position:relative;
overflow:hidden;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
left:0;
top:0;
opacity:0;
transition:opacity 1s ease-in-out;
}

.slide.active{
opacity:1;
}

/* next button */

.next-btn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
}

.next-btn button{
padding:14px 40px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:40px;
background:#00FF7F;
color:#064d2f;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
transition:0.3s;
}

.next-btn button:hover{
background:#00cc66;
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="container">

<h1>Something for You 💚</h1>

<div id="message"></div>

<!-- MUSIC -->

<audio autoplay loop controls>
<source src="vlc-record-2026-03-17-10h29m30s-Innunu Bekagide - Vasuki Vaibhav-(Fun2Desi.Com)-.mp3" type="audio/mpeg">
</audio>

<!-- SLIDESHOW -->

<div class="slideshow-container">

<img src="0ad38ac2-9111-43c8-ad9a-cce2799ec1a7.jpg" class="slide active">

<img src="f7fba758-3420-4588-8362-21aed5b70d36.jpg" class="slide">

<img src="4ca1a41d-4a98-41de-99b9-a01d5cf987ae.jpg" class="slide">

<img src="1ad18c1e-b076-41b1-98bb-d322c08e0744.jpg" class="slide">

</div>

</div>

<!-- NEXT BUTTON -->

<div class="next-btn">
<button onclick="nextPage()">Next 💚</button>
</div>

<script>

/* typing effect */

const text = "You are one of the most special people in my life... 💚 Thank you for all the smiles, memories, and moments we share.";

let i = 0;

function typing(){

if(i < text.length){

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typing,40);

}

}

typing();


/* slideshow */

let slides = document.querySelectorAll(".slide");

let currentSlide = 0;

function changeSlide(){

slides[currentSlide].classList.remove("active");

currentSlide++;

if(currentSlide >= slides.length){
currentSlide = 0;
}

slides[currentSlide].classList.add("active");

}

setInterval(changeSlide, 2500);


/* next page */

function nextPage(){

window.location.href = "message.html";

}

</script>

</body>
</html>
