<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Gallery 💚</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#00ff88,#b8ffd8);
overflow-x:hidden;
padding:50px 20px;
min-height:100vh;
}

/* heading */

.heading{
text-align:center;
margin-bottom:50px;
color:white;
}

.heading h1{
font-size:60px;
margin-bottom:10px;
text-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.heading p{
font-size:22px;
}

/* gallery */

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:40px;
}

/* polaroid */

.polaroid{
width:280px;
background:white;
padding:15px 15px 70px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
position:relative;
transition:0.4s;
transform:rotate(-3deg);
animation:float 4s ease-in-out infinite;
}

.polaroid:nth-child(even){
transform:rotate(3deg);
}

.polaroid:hover{
transform:scale(1.08) rotate(0deg);
}

/* image */

.polaroid img{
width:100%;
height:300px;
object-fit:cover;
border-radius:8px;
}

/* caption */

.caption{
position:absolute;
bottom:20px;
width:100%;
left:0;
text-align:center;
font-size:22px;
font-family:cursive;
color:#333;
}

/* floating animation */

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* next button */

.next-btn{
text-align:center;
margin-top:70px;
}

.next-btn button{
padding:16px 45px;
border:none;
border-radius:40px;
background:white;
color:#00bb66;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.next-btn button:hover{
transform:scale(1.08);
}

/* mobile */

@media(max-width:768px){

.heading h1{
font-size:40px;
}

.heading p{
font-size:18px;
}

.polaroid{
width:90%;
}

}

</style>

</head>

<body>

<!-- heading -->

<div class="heading">

<h1>Our Little Scrapbook 💚</h1>

<p>Some memories deserve to stay forever ✨</p>

</div>

<!-- gallery -->

<div class="gallery">

<!-- photo 1 -->

<div class="polaroid">

<img src="photo1.jpg">

<div class="caption">
Forever Favorite 💚
</div>

</div>

<!-- photo 2 -->

<div class="polaroid">

<img src="photo2.jpg">

<div class="caption">
Best Smile ✨
</div>

</div>

<!-- photo 3 -->

<div class="polaroid">

<img src="photo3.jpg">

<div class="caption">
Pure Happiness 🌸
</div>

</div>

<!-- photo 4 -->

<div class="polaroid">

<img src="photo4.jpg">

<div class="caption">
Special Moment 💚
</div>

</div>

</div>

<!-- button -->

<div class="next-btn">

<button onclick="nextPage()">Final Surprise 💚</button>

</div>

<script>

function nextPage(){

window.location.href="universe.html";

}

</script>

</body>

</html>
