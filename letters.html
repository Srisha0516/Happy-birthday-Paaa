<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open When... 💚</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Segoe UI',sans-serif;
min-height:100vh;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#00ff88,#b8ffd8);
position:relative;
padding:40px 20px;
}

/* ✨ glow */

.glow{
position:absolute;
width:650px;
height:650px;
background:radial-gradient(circle,#00ff88 0%,transparent 70%);
filter:blur(120px);
opacity:0.25;
animation:pulse 5s infinite alternate;
}

@keyframes pulse{

from{
transform:scale(1);
opacity:0.2;
}

to{
transform:scale(1.2);
opacity:0.35;
}

}

/* 💚 floating hearts */

.hearts span{
position:absolute;
bottom:-100px;
font-size:24px;
animation:float 10s linear infinite;
opacity:0.7;
}

.hearts span:nth-child(1){left:10%;animation-duration:8s;}
.hearts span:nth-child(2){left:20%;animation-duration:12s;}
.hearts span:nth-child(3){left:35%;animation-duration:9s;}
.hearts span:nth-child(4){left:50%;animation-duration:11s;}
.hearts span:nth-child(5){left:65%;animation-duration:7s;}
.hearts span:nth-child(6){left:80%;animation-duration:10s;}
.hearts span:nth-child(7){left:90%;animation-duration:13s;}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

50%{
opacity:1;
}

100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}

}

/* heading */

.heading{
text-align:center;
margin-bottom:50px;
color:white;
z-index:2;
animation:fadeDown 1.5s ease;
}

.heading h1{
font-size:65px;
margin-bottom:12px;
text-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.heading p{
font-size:24px;
}

@keyframes fadeDown{

from{
opacity:0;
transform:translateY(-30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* buttons */

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
width:90%;
max-width:1100px;
z-index:2;
}

.buttons button{
padding:20px 35px;
border:none;
border-radius:45px;
background:rgba(255,255,255,0.95);
color:#00aa66;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
min-width:280px;
}

.buttons button:hover{
transform:scale(1.08);
background:#f5fff9;
}

/* popup */

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
width:75%;
max-width:650px;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(12px);
padding:45px;
border-radius:35px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
transition:0.4s;
z-index:20;
}

.popup.active{
transform:translate(-50%,-50%) scale(1);
}

.popup h2{
color:#00aa66;
margin-bottom:25px;
font-size:40px;
}

.popup p{
font-size:24px;
line-height:1.9;
color:#333;
}

/* close button */

.close-btn{
margin-top:30px;
padding:14px 35px;
border:none;
border-radius:35px;
background:#00ff88;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.close-btn:hover{
transform:scale(1.08);
background:#00cc66;
}

/* overlay */

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
top:0;
left:0;
display:none;
z-index:15;
}

.overlay.active{
display:block;
}

/* next button */

.next-btn{
margin-top:60px;
z-index:2;
}

.next-btn button{
padding:18px 50px;
border:none;
border-radius:45px;
background:white;
color:#00bb66;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.next-btn button:hover{
transform:scale(1.08);
background:#f3fff8;
}

/* mobile */

@media(max-width:768px){

.heading h1{
font-size:42px;
}

.heading p{
font-size:18px;
}

.buttons{
width:100%;
}

.buttons button{
font-size:16px;
padding:16px 20px;
min-width:100%;
}

.popup{
width:92%;
padding:30px 20px;
}

.popup h2{
font-size:30px;
}

.popup p{
font-size:18px;
}

.next-btn button{
font-size:18px;
padding:15px 35px;
}

}

</style>

</head>

<body>

<!-- 🎵 music -->

<iframe src="music.html"
allow="autoplay"
style="display:none">
</iframe>

<!-- ✨ glow -->

<div class="glow"></div>

<!-- 💚 hearts -->

<div class="hearts">

<span>💚</span>
<span>✨</span>
<span>💚</span>
<span>✨</span>
<span>💚</span>
<span>✨</span>
<span>💚</span>

</div>

<!-- overlay -->

<div class="overlay" id="overlay"></div>

<!-- heading -->

<div class="heading">

<h1>Open When... 💚</h1>

<p>Little letters for every moment ✨</p>

</div>

<!-- buttons -->

<div class="buttons">

<button onclick="openPopup('sad')">
Open when you're sad 💚
</button>

<button onclick="openPopup('miss')">
Open when you miss me ✨
</button>

<button onclick="openPopup('smile')">
Open when you need a smile 🌸
</button>

<button onclick="openPopup('special')">
Open when you feel alone 🫶
</button>

</div>

<!-- popup -->

<div class="popup" id="popup">

<h2 id="popupTitle"></h2>

<p id="popupText"></p>

<button class="close-btn" onclick="closePopup()">
Close 💚
</button>

</div>

<!-- next button -->

<div class="next-btn">

<button onclick="nextPage()">
Final Universe 💚
</button>

</div>

<script>

/* 💚 popup messages */

function openPopup(type){

const popup = document.getElementById("popup");

const overlay = document.getElementById("overlay");

const title = document.getElementById("popupTitle");

const text = document.getElementById("popupText");

popup.classList.add("active");

overlay.classList.add("active");

if(type=="sad"){

title.innerHTML="For Your Sad Days 💚";

text.innerHTML=
"No matter how difficult life feels sometimes... please remember that you are deeply appreciated, loved, and important ✨ Better days are waiting for you 💚";

}

if(type=="miss"){

title.innerHTML="When You Miss Me ✨";

text.innerHTML=
"Distance or silence can never change how special you are to me 💚 Anytime you need me, I'm always just one call away 🌸";

}

if(type=="smile"){

title.innerHTML="A Little Smile 🌸";

text.innerHTML=
"Your smile is honestly one of the prettiest things in this world 💖 Never lose that beautiful smile because it makes everything brighter ✨";

}

if(type=="special"){

title.innerHTML="For Lonely Moments 🫶";

text.innerHTML=
"Even on your worst days... you will never be alone 💚 No matter what happens, I will always care about you and be there for you ✨";

}

}

/* close popup */

function closePopup(){

document.getElementById("popup").classList.remove("active");

document.getElementById("overlay").classList.remove("active");

}

/* next page */

function nextPage(){

window.location.href="universe.html";

}

</script>

</body>

</html>
